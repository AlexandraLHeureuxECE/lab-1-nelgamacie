<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tic-Tac-Toe</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="game-container">
    <h1>Tic-Tac-Toe</h1>
    <p id="status" class="status" aria-live="polite">Player X's turn</p>
    <div id="grid" class="grid" role="grid" aria-label="Tic-Tac-Toe board">
      <!-- Cells filled by script -->
    </div>
    <button type="button" id="restart" class="restart">Restart</button>
  </main>
  <script src="script.js"></script>
</body>
</html>
